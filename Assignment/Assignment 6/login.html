```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Login</title>

    <link rel="stylesheet" href="style4.css">
</head>

<body class="login-page">


    <header class="login-heading">

        <h1>Student Login</h1>

        <p>Welcome to your campus account</p>

    </header>


    <main class="login-container">

        <form class="login-card">

            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Login to continue your journey.
            </p>


            <div class="login-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="student@example.com"
                    required
                >

            </div>


            <div class="login-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="login-options">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button type="submit" class="login-button">
                Log In
            </button>


            <p class="signup-text">

                New student?

                <a href="#">
                    Create Account
                </a>

            </p>

        </form>

    </main>


</body>

</html>
```
